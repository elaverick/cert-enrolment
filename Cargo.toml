[package]
name = "cert-enrolment"
version = "0.1.0"
edition = "2021"

# Dependencies are kept to a small, agreed set (see README.md). Each one is
# added alongside the feature that needs it.
[dependencies]
tiny_http = "0.12"
ldap3 = { version = "0.12", default-features = false, features = ["sync", "tls-rustls-ring"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
base64 = "0.23"
serde_json = "1"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
x509-parser = "0.18"

[[bin]]
name = "cert-enrolment"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
